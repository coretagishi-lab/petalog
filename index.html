<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>ぺたろぐは引っ越しました</title>
<link rel="canonical" href="https://petalog-stamp.github.io/">
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#ECEDEF;color:#1B2130;font:16px/1.7 "Hiragino Sans",system-ui,sans-serif;text-align:center;padding:0 24px}
a,button{display:inline-block;margin-top:14px;padding:12px 22px;border-radius:999px;border:0;background:#1F3570;color:#fff;font:inherit;font-weight:700;text-decoration:none}
#box[hidden]{display:none}</style>
</head><body><div>
<p><b>ぺたろぐは新しいアドレスに引っ越しました</b><br>petalog-stamp.github.io</p>
<p id="m">移動しています…</p>
<div id="box" hidden><p>この端末だけに保存している記録があります。<br>ボタンを押すと新しいアドレスへ記録ごと引っ越します。</p><button id="go" type="button">記録ごと引っ越す</button></div>
<div id="hs" hidden style="text-align:left;max-width:340px;margin:0 auto"><p><b>ホーム画面のアイコンを作り直してください（1回だけ）</b></p>
<ol style="padding-left:1.3em;margin:0"><li>下の「新しいぺたろぐを開く」を押す</li><li>開いた画面の<b>右下のコンパスのマーク</b>を押して、Safariで開く</li><li>Safariの共有ボタン（□に↑）から<b>「ホーム画面に追加」</b></li><li>今のアイコンは長押しして削除</li></ol>
<p style="font-size:14px;color:#555">新しいアイコンから開くと、上と下のバーなしで使えます。</p></div>
<button id="hsGo" type="button" hidden>新しいぺたろぐを開く</button>
<a id="lnk" href="https://petalog-stamp.github.io/">新しいぺたろぐを開く</a>
</div>
<script>
/* 旧アドレス → https://petalog-stamp.github.io/ への案内。
   - ログインの戻り（#access_token など）はそのまま転送
   - 端末内の設定・ログイン状態（localStorage の petalog*）は1回だけ新アドレスへ持っていく
   - 「この端末だけに保存」の記録（IndexedDB）があるときは、ボタンで新アドレスを開いて postMessage で渡す */
(function () {
  var NEW = "https://petalog-stamp.github.io", m = document.getElementById("m");
  // ホーム画面のアイコン（前のアドレス）から開いたときは、新しいアドレスはアプリの外あつかいになり上下にバーが出る → 作り直し方を先に見せる
  var standalone = navigator.standalone === true || (window.matchMedia && matchMedia("(display-mode: standalone)").matches);
  if (standalone && !/access_token|refresh_token/.test(location.hash)) {
    m.textContent = ""; document.getElementById("hs").hidden = false; document.getElementById("lnk").hidden = true;
    var g = document.getElementById("hsGo"); g.hidden = false; g.onclick = function () { g.disabled = true; m.textContent = "移動しています…"; run(); };
    return;
  }
  run();
  function run() {
  if ("serviceWorker" in navigator) navigator.serviceWorker.getRegistrations().then(function (rs) { rs.forEach(function (r) { r.unregister(); }); }).catch(function () {});
  function go(u) { location.replace(u); }
  var q = location.search, h = location.hash;
  if (/access_token|refresh_token|error_description|[#&]error=|type=recovery/.test(h)) return go(NEW + "/" + q + h);
  var ls = {}, moved = false;
  try { moved = localStorage.getItem("petalog.movedTo") === NEW; for (var i = 0; i < localStorage.length; i++) { var k = localStorage.key(i); if (k && /^petalog/.test(k) && k !== "petalog.movedTo") ls[k] = localStorage.getItem(k); } } catch (e) {}
  function mark() { try { localStorage.setItem("petalog.movedTo", NEW); } catch (e) {} }
  function plain() {
    if (!moved && Object.keys(ls).length) { mark(); return go(NEW + "/migrate.html#mv=" + encodeURIComponent(JSON.stringify({ ls: ls, q: q, h: h }))); }
    go(NEW + "/" + q + h);
  }
  if (moved || !window.indexedDB) return plain();
  var created = false, r;
  try { r = indexedDB.open("petalog"); } catch (e) { return plain(); }
  r.onupgradeneeded = function () { created = true; try { r.transaction.abort(); } catch (e) {} };
  r.onerror = function () { if (created) try { indexedDB.deleteDatabase("petalog"); } catch (e) {} plain(); };
  r.onsuccess = function () {
    var db = r.result, names = ["stamps", "photos", "meta"].filter(function (n) { return db.objectStoreNames.contains(n); });
    if (!names.length) { db.close(); return plain(); }
    var out = {}, left = names.length;
    names.forEach(function (n) {
      out[n] = []; var tx = db.transaction(n, "readonly"), c = tx.objectStore(n).openCursor();
      c.onsuccess = function () { var cur = c.result; if (cur) { out[n].push([cur.key, cur.value]); cur.continue(); } };
      tx.oncomplete = tx.onerror = function () { if (--left) return; db.close(); ready(out); };
    });
  };
  function ready(idb) {
    if (!(idb.stamps && idb.stamps.length)) return plain();
    m.textContent = ""; document.getElementById("box").hidden = false;
    var w = null, sent = false;
    addEventListener("message", function (e) {
      if (e.origin !== NEW) return;
      if (e.data === "petalog-ready" && w && !sent) { sent = true; w.postMessage({ type: "petalog-move", ls: ls, idb: idb }, NEW); m.textContent = "引っ越し中…"; }
      if (e.data === "petalog-done") { mark(); document.getElementById("box").hidden = true; m.textContent = "引っ越し完了！新しいタブのぺたろぐをお使いください"; }
    });
    document.getElementById("go").onclick = function () { sent = false; w = window.open(NEW + "/migrate.html?popup=1", "_blank"); if (!w) m.textContent = "新しいタブが開けませんでした。ポップアップを許可してもう一度押してください"; };
  }
  }
})();
</script></body></html>
